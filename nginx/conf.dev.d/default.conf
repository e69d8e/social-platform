# ========== 本地开发 / IDEA 调试模式 Nginx 站点配置 ==========
# 使用 Docker 内置 DNS 动态解析，避免 Nginx 在启动阶段因同步解析 host.docker.internal 失败而崩溃
server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 客户端最大上传限制（与后端 10MB 保持一致）
    client_max_body_size 10M;

    # Docker 内置 DNS 解析器（127.0.0.11），动态解析 host.docker.internal
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $sp_backend "http://host.docker.internal:8081";

    # 前端 SPA 静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 图片静态访问（直接通过 Nginx 高速响应，不经过后端）
    location /imgs {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 REST 接口代理（去掉 /api 前缀，代理到本地 IDEA 运行的 Spring Boot）
    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $sp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 10M;
    }

    # WebSocket 实时消息代理（代理到本地 IDEA 运行的 Spring Boot）
    location /ws {
        proxy_pass $sp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Knife4j API 文档支持（代理到本地 IDEA 运行的 Spring Boot）
    location ~* ^/(doc\.html|webjars|v3/api-docs|swagger-resources) {
        proxy_pass $sp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
