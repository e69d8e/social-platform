# ========== 生产 / 容器全量模式 Nginx 站点配置 ==========
# 反向代理目标为 Docker 内部网络中的 sp-app 容器
upstream sp-app {
    server sp-app:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 客户端最大上传限制（与后端 10MB 保持一致）
    client_max_body_size 10M;

    # 前端 SPA 静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 图片静态访问（Nginx 代理 MinIO 对象存储直出，不经过后端；
    # 路径映射：/imgs/<对象名> -> MinIO social-platform 桶/<对象名>，桶名需与 MINIO_BUCKET 保持一致）
    location /imgs/ {
        proxy_pass http://sp-minio:9000/social-platform/;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 REST 接口代理（去掉 /api 前缀）
    location /api {
        rewrite /api(/.*) $1 break;
        proxy_pass http://sp-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 10M;
    }

    # WebSocket 实时消息代理
    location /ws {
        proxy_pass http://sp-app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Knife4j API 文档支持
    location ~* ^/(doc\.html|webjars|v3/api-docs|swagger-resources) {
        proxy_pass http://sp-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
