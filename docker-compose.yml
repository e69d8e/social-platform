services:
  # ========== 应用服务 ==========
  sp-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sp-app:latest
    container_name: sp-app
    ports:
      - "8081:8081"
    environment:
      # Spring Boot 环境变量覆盖 application.yaml 中的地址
      # 容器间通过服务名通信，而非 127.0.0.1
      SPRING_DATASOURCE_URL: "jdbc:mysql://sp-mysql:3306/social_platform?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATA_REDIS_HOST: "sp-redis"
      SPRING_DATA_MONGODB_URI: "mongodb://sp-mongodb:27017/chat_memory_db"
      SPRING_ELASTICSEARCH_URIS: "http://sp-es:9200"
      SPRING_ELASTICSEARCH_USERNAME: "elastic"
      SPRING_ELASTICSEARCH_PASSWORD: "${PASSWORD}"
      # 业务环境变量
      PASSWORD: "${PASSWORD:?请先复制 .env.example 为 .env 并填写 PASSWORD}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-${DEEPSEEK_API_KEY}}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-${DEEPSEEK_BASE_URL:-https://api.deepseek.com}}"
      MODEL_NAME: "${MODEL_NAME:-${DEEPSEEK_MODEL_NAME:-deepseek-v4-flash}}"
      IMAGE_PATH: "/usr/local/nginx/html/imgs"
      IMG_BASE_URL: "${IMG_BASE_URL:-http://127.0.0.1:8080/imgs}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:5173,http://localhost:8080}"
      # JVM 参数
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"
    # 内存上限（JVM 按 75% 容器上限自适应堆大小）
    mem_limit: 1g
    volumes:
      - ${HTML_PATH:-./html}/imgs:/usr/local/nginx/html/imgs  # 宿主机目录：与 sp-nginx 共享同一份图片
    depends_on:
      sp-mysql:
        condition: service_healthy
      sp-redis:
        condition: service_healthy
      sp-es:
        condition: service_healthy
      sp-mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  # ========== 基础设施服务 ==========

  sp-mysql:
    image: mysql:8.0.46
    container_name: sp-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --init-connect='SET NAMES utf8mb4'
    # 仅绑定宿主机回环地址：本地 IDEA 开发模式仍可 127.0.0.1 直连，
    # 但避免 MySQL/Redis/ES/MongoDB 无认证裸奔公网；远程管理请走 SSH 隧道
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${PASSWORD}"
      MYSQL_DATABASE: social_platform
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化 SQL（首次启动时执行）
      - ./src/main/resources/social_platform.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-redis:
    image: redis:6.0.16
    container_name: sp-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-es:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: sp-es:9.2.0-ik
    container_name: sp-es
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      # 启用认证：elastic 用户密码复用 .env 的 PASSWORD（Basic 认证）；
      # 单节点内网/回环场景不启用 HTTP 与 transport 层 TLS
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:${PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ES 认证一次性初始化任务：Kibana 8/9 禁止使用 elastic 超级用户连接，
  # 此处复用 sp-es 镜像内置 curl 为内置 kibana_system 用户设置密码（幂等，可重复执行）
  sp-es-init:
    image: sp-es:9.2.0-ik
    container_name: sp-es-init
    depends_on:
      sp-es:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "为 kibana_system 用户初始化密码..."
        curl -fs -u "elastic:${PASSWORD}" -X PUT "http://sp-es:9200/_security/user/kibana_system/_password" \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"${PASSWORD}\"}" \
          && echo "kibana_system 密码初始化完成"
    mem_limit: 128m
    restart: "no"
    networks:
      - sp

  sp-mongodb:
    image: mongo:8.0.16
    container_name: sp-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  # 生产 / 容器全量模式 Nginx（反向代理至 sp-app 容器）
  sp-nginx:
    image: nginx:stable-alpine
    container_name: sp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${HTML_PATH:-./html}:/usr/share/nginx/html  # 宿主机 html 目录（包含前端 index.html/assets 与 imgs 图片）
    depends_on:
      - sp-app
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  # 本地开发 / IDEA 调试模式 Nginx（反向代理至宿主机 IDEA 运行的 8081 服务）
  sp-nginx-dev:
    image: nginx:stable-alpine
    container_name: sp-nginx-dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.dev.d:/etc/nginx/conf.d:ro
      - ${HTML_PATH:-./html}:/usr/share/nginx/html  # 宿主机 html 目录（包含前端 index.html/assets 与 imgs 图片）
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 允许容器访问宿主机网络
    profiles:
      - dev
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-kibana:
    image: kibana:9.2.0
    container_name: sp-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://sp-es:9200"
      # Kibana 8/9 禁用 elastic 超级用户连接，改用内置 kibana_system 用户（密码由 sp-es-init 任务设置）
      ELASTICSEARCH_USERNAME: "kibana_system"
      ELASTICSEARCH_PASSWORD: "${PASSWORD}"
      # 限制 Kibana 内置 Node.js 堆，防止超出容器内存上限被 OOM Kill
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      sp-es:
        condition: service_healthy
      sp-es-init:
        condition: service_completed_successfully
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

# ========== 持久化卷 ==========
# 统一使用明确命名的命名卷：既可复用已有历史数据，又能在新环境部署时自动创建
volumes:
  mysql-data:
    name: sp-mysql-data
  redis-data:
    name: sp-redis-data
  es-data:
    name: sp-es-data
  mongo-data:
    name: sp-mongodb-data
  mongo-config:
    name: sp-mongo-config

# ========== 网络 ==========
networks:
  sp:
    driver: bridge



