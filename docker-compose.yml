services:
  # ========== 应用服务 ==========
  sp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sp-app
    ports:
      - "8081:8081"
    environment:
      # Spring Boot 环境变量覆盖 application.yaml 中的地址
      # 容器间通过服务名通信，而非 127.0.0.1
      SPRING_DATASOURCE_URL: "jdbc:mysql://sp-mysql:3306/social_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATA_REDIS_HOST: "sp-redis"
      SPRING_DATA_MONGODB_URI: "mongodb://sp-mongodb:27017/chat_memory_db"
      SPRING_ELASTICSEARCH_URIS: "http://sp-es:9200"
      # 业务环境变量
      PASSWORD: "${PASSWORD}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      IMAGE_PATH: "/usr/local/nginx/html/imgs"
      BASE_URL: "${BASE_URL:-http://127.0.0.1:8080/imgs}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:5173,http://localhost:8080}"
      # JVM 参数
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"
    volumes:
      - ./html/imgs:/usr/local/nginx/html/imgs  # 宿主机目录：与 sp-nginx 共享同一份图片
    depends_on:
      sp-mysql:
        condition: service_healthy
      sp-redis:
        condition: service_healthy
      sp-es:
        condition: service_healthy
      sp-mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  # ========== 基础设施服务 ==========

  sp-mysql:
    image: mysql:8.0.46
    container_name: sp-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${PASSWORD}"
      MYSQL_DATABASE: social_platform
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化 SQL（首次启动时执行）
      - ./src/main/resources/social_platform.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-redis:
    image: redis:6.0.16
    container_name: sp-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-es:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: sp-es:9.2.0-ik
    container_name: sp-es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-mongodb:
    image: mongo:8.0.16
    container_name: sp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-nginx:
    image: nginx:stable-alpine
    container_name: sp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html  # 宿主机 html 目录（包含前端 index.html/assets 与 imgs 图片）
    depends_on:
      - sp-app
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

  sp-kibana:
    image: kibana:9.2.0
    container_name: sp-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://sp-es:9200"
    depends_on:
      sp-es:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - sp
    restart: unless-stopped

# ========== 持久化卷 ==========
# 统一使用明确命名的命名卷：既可复用已有历史数据，又能在新环境部署时自动创建
volumes:
  mysql-data:
    name: sp-mysql-data
  redis-data:
    name: sp-redis-data
  es-data:
    name: sp-es-data
  mongo-data:
    name: sp-mongodb-data
  mongo-config:
    name: sp-mongo-config

# ========== 网络 ==========
networks:
  sp:
    driver: bridge



